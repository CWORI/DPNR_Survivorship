<script>
document.addEventListener("DOMContentLoaded", () => {
  // Figure filenames are stable across Quarto renders. Add a release version so
  // browsers do not reuse an older SVG after chart axes or labels change.
  for (const image of document.querySelectorAll('img[src*="/figure-html/"]')) {
    const figureUrl = new URL(image.getAttribute("src"), document.baseURI);
    figureUrl.searchParams.set("v", "20261027-object-lineage");
    image.src = figureUrl.href;
  }

  function showLinkedReportTab() {
    const target = document.getElementById(window.location.hash.slice(1));
    const pane = target?.closest(".tab-pane");
    if (!pane || pane.classList.contains("active")) return;

    const tab = document.getElementById(pane.id + "-tab");
    if (!tab || !window.bootstrap?.Tab) return;

    tab.addEventListener("shown.bs.tab", () => {
      target.scrollIntoView();
    }, { once: true });
    window.bootstrap.Tab.getOrCreateInstance(tab).show();
  }

  showLinkedReportTab();
  window.addEventListener("hashchange", showLinkedReportTab);

  const excluded = new Set(["CODE", "PRE", "SCRIPT", "STYLE", "TEXTAREA"]);
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const nodes = [];

  while (walker.nextNode()) {
    nodes.push(walker.currentNode);
  }

  for (const node of nodes) {
    let parent = node.parentElement;
    let skip = false;

    while (parent) {
      if (excluded.has(parent.tagName) || parent.classList.contains("site-hero")) {
        skip = true;
        break;
      }
      parent = parent.parentElement;
    }

    if (skip) continue;

    node.nodeValue = node.nodeValue
      .replace(/\bPlots? ([A-H])\b/g, "Coki $1")
      .replace(/\bPlots\b/g, "Coki sites")
      .replace(/\bplots\b/g, "Coki sites")
      .replace(/\bPlot\b/g, "Coki")
      .replace(/\bplot\b/g, "Coki");
  }
});
</script>
